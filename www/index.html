<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Om Namah Shivaya</title>
  <style>
    :root {
      --bg: #0c0e12;
      --card: rgba(22, 26, 34, 0.88);
      --gold: #d4af37;
      --text: #f0f2f5;
      --text-muted: #a0abb6;
      --border: rgba(212, 175, 55, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: linear-gradient(rgba(12, 14, 18, 0.78), rgba(12, 14, 18, 0.88)), 
                  url('bg.png') no-repeat center center fixed;
      background-size: cover;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      padding: 24px 16px 10px;
      text-align: center;
      background: linear-gradient(180deg, rgba(212,175,55,0.15) 0%, transparent 100%);
    }
    h1 {
      font-size: 1.6rem;
      color: var(--gold);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .header-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 14px 0 8px;
    }
    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 0.88rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 600;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
    }
    .view {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 36px;
      flex: 1;
    }
    .view.active {
      display: flex;
    }

    /* Japamala Section */
    .bead-counter-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      width: 100%;
    }
    .counter-btn {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(37, 44, 58, 0.9) 0%, rgba(17, 20, 27, 0.95) 80%);
      border: 3px solid var(--gold);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      backdrop-filter: blur(6px);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .counter-btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 14px rgba(212, 175, 55, 0.5);
    }
    .count-number {
      font-size: 3.8rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }
    .count-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .round-info {
      margin-top: 24px;
      font-size: 1rem;
      color: var(--text);
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
    }
    .reset-btn {
      margin-top: 20px;
      background: rgba(22, 26, 34, 0.8);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 18px;
      border-radius: 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Category Filter Chips */
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      width: 100%;
      max-width: 550px;
      padding: 8px 4px 14px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar {
      display: none;
    }
    .filter-chip {
      background: rgba(22, 26, 34, 0.7);
      border: 1px solid rgba(212, 175, 55, 0.2);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.76rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-chip.active {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 600;
    }

    /* Content Cards */
    .content-list {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .content-card {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 16px;
      backdrop-filter: blur(8px);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .card-badge {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gold);
      margin-bottom: 3px;
    }
    .card-title {
      font-size: 1.15rem;
      color: var(--gold);
      margin-bottom: 2px;
    }
    .card-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .tts-btn {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .tts-btn:active {
      transform: scale(0.95);
    }
    .tts-btn.speaking {
      background: #d4af37;
      color: #0c0e12;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }
    .card-verse {
      white-space: pre-line;
      line-height: 1.8;
      font-size: 0.95rem;
      background: rgba(15, 18, 23, 0.85);
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
      margin-bottom: 10px;
    }
    .card-trans {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <h1>ॐ नमः शिवाय</h1>
    <div class="header-sub">Lord Shiva Devotion & Encyclopedia</div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-btn-mala" onclick="switchTab('mala')">📿 Japamala</button>
      <button class="tab-btn" id="tab-btn-encyclopedia" onclick="switchTab('encyclopedia')">🔱 Divine Wisdom</button>
    </div>
  </header>

  <!-- Japamala Tab -->
  <section id="mala-view" class="view active">
    <div class="bead-counter-wrapper">
      <button class="counter-btn" id="counter-btn" onclick="tapBead()">
        <span class="count-number" id="count-display">0</span>
        <span class="count-sub">/ 108</span>
      </button>
      <div class="round-info" id="round-display">Mala Rounds Completed: 0</div>
      <button class="reset-btn" onclick="resetCounter()">Reset Beads</button>
    </div>
  </section>

  <!-- Encyclopedia & Content Tab -->
  <section id="encyclopedia-view" class="view">
    <div class="filter-bar">
      <button class="filter-chip active" onclick="setFilter('all', this)">✨ All</button>
      <button class="filter-chip" onclick="setFilter('mantra', this)">📿 Mantras</button>
      <button class="filter-chip" onclick="setFilter('jyotirlinga', this)">🛕 Jyotirlingas</button>
      <button class="filter-chip" onclick="setFilter('symbolism', this)">🔱 Sacred Symbols</button>
      <button class="filter-chip" onclick="setFilter('lore', this)">📜 Divine Lore</button>
    </div>

    <div class="content-list" id="content-container">
      <p style="text-align: center; color: #888; padding: 20px;">Loading sacred content...</p>
    </div>
  </section>

  <script>
    let beadCount = parseInt(localStorage.getItem('shiva_bead_count') || '0', 10);
    let malasCompleted = parseInt(localStorage.getItem('shiva_mala_count') || '0', 10);
    let currentlySpeakingId = null;
    let allContentData = [];
    let currentFilter = 'all';

    function updateCounterUI() {
      const countEl = document.getElementById('count-display');
      const roundEl = document.getElementById('round-display');
      if (countEl) countEl.innerText = beadCount;
      if (roundEl) roundEl.innerText = `Mala Rounds Completed: ${malasCompleted}`;
    }
    updateCounterUI();

    function tapBead() {
      beadCount++;
      if (navigator.vibrate) navigator.vibrate(40);

      if (beadCount >= 108) {
        beadCount = 0;
        malasCompleted++;
        if (navigator.vibrate) navigator.vibrate([100, 50, 150]);
      }

      localStorage.setItem('shiva_bead_count', beadCount);
      localStorage.setItem('shiva_mala_count', malasCompleted);
      updateCounterUI();
    }

    function resetCounter() {
      if (confirm("Reset current bead count to 0?")) {
        beadCount = 0;
        localStorage.setItem('shiva_bead_count', 0);
        updateCounterUI();
      }
    }

    function switchTab(tab) {
      stopSpeech();

      const btnMala = document.getElementById('tab-btn-mala');
      const btnEnc = document.getElementById('tab-btn-encyclopedia');
      const viewMala = document.getElementById('mala-view');
      const viewEnc = document.getElementById('encyclopedia-view');

      if (tab === 'mala') {
        btnMala.classList.add('active');
        btnEnc.classList.remove('active');
        viewMala.classList.add('active');
        viewEnc.classList.remove('active');
      } else {
        btnEnc.classList.add('active');
        btnMala.classList.remove('active');
        viewEnc.classList.add('active');
        viewMala.classList.remove('active');
        loadAllContent();
      }
    }

    function setFilter(category, btnEl) {
      currentFilter = category;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderContentList();
    }

    function loadAllContent() {
      if (allContentData && allContentData.length > 0) return;

      fetch('data/content.json')
        .then(res => res.json())
        .then(items => {
          allContentData = items;
          renderContentList();
        })
        .catch(err => {
          console.error("Content loading failed:", err);
          document.getElementById('content-container').innerHTML =
            '<p style="text-align:center; color: #a0abb6; padding: 20px;">Unable to load content.</p>';
        });
    }

    function renderContentList() {
      const container = document.getElementById('content-container');
      const filtered = currentFilter === 'all' 
        ? allContentData 
        : allContentData.filter(item => item.type === currentFilter);

      const typeMeta = {
        mantra: { icon: '📿', label: 'Mantra' },
        jyotirlinga: { icon: '🛕', label: 'Jyotirlinga' },
        symbolism: { icon: '🔱', label: 'Sacred Symbol' },
        lore: { icon: '📜', label: 'Divine Lore' }
      };

      container.innerHTML = filtered.map(item => {
        const meta = typeMeta[item.type] || { icon: '🕉️', label: 'Devotion' };
        const verseHtml = item.sanskrit 
          ? `<div class="card-verse">${item.sanskrit}</div>` 
          : '';

        return `
          <div class="content-card">
            <div class="card-top">
              <div>
                <div class="card-badge">${meta.icon} ${meta.label}</div>
                <h2 class="card-title">${item.title}</h2>
                <div class="card-sub">${item.subtitle}</div>
              </div>
              <button class="tts-btn" id="tts-btn-${item.id}" onclick="toggleSpeech('${item.id}')">
                🔊 Listen
              </button>
            </div>
            ${verseHtml}
            <div class="card-trans">${item.translation}</div>
          </div>
        `;
      }).join('');
    }

    function invokeCapacitorPlugin(pluginName, methodName, options) {
      if (window.Capacitor) {
        if (window.Capacitor.Plugins && window.Capacitor.Plugins[pluginName] && window.Capacitor.Plugins[pluginName][methodName]) {
          return window.Capacitor.Plugins[pluginName][methodName](options);
        }
        if (typeof window.Capacitor.nativePromise === 'function') {
          return window.Capacitor.nativePromise(pluginName, methodName, options);
        }
        if (typeof window.Capacitor.toNative === 'function') {
          return new Promise((resolve, reject) => {
            window.Capacitor.toNative(pluginName, methodName, options, {
              callback: (result, err) => err ? reject(err) : resolve(result)
            });
          });
        }
      }
      return Promise.reject("Native Capacitor bridge unavailable");
    }

    async function toggleSpeech(id) {
      if (currentlySpeakingId === id) {
        await stopSpeech();
        return;
      }

      await stopSpeech();

      const item = allContentData.find(x => x.id === id);
      if (!item) return;

      const cleanSanskrit = (item.sanskrit || '').replace(/[॥।\n]/g, ' ').replace(/\s+/g, ' ').trim();
      const cleanTranslation = (item.translation || '').replace(/\n/g, ' ').trim();

      const btn = document.getElementById(`tts-btn-${id}`);
      if (btn) {
        btn.innerText = '⏹ Stop';
        btn.classList.add('speaking');
      }
      currentlySpeakingId = id;

      try {
        if (cleanSanskrit) {
          await invokeCapacitorPlugin('TextToSpeech', 'speak', {
            text: cleanSanskrit,
            lang: 'hi-IN',
            rate: 0.85,
            pitch: 1.0,
            volume: 1.0,
            category: 'ambient'
          });

          if (currentlySpeakingId !== id) return;
          await new Promise(r => setTimeout(r, 600));
          if (currentlySpeakingId !== id) return;
        }

        const preface = cleanSanskrit ? "Meaning: " : "";
        await invokeCapacitorPlugin('TextToSpeech', 'speak', {
          text: preface + cleanTranslation,
          lang: 'en-IN',
          rate: 0.95,
          pitch: 1.0,
          volume: 1.0,
          category: 'ambient'
        });

      } catch (nativeErr) {
        console.warn("Falling back to Web Speech:", nativeErr);
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();

          if (cleanSanskrit) {
            const skUtterance = new SpeechSynthesisUtterance(cleanSanskrit);
            skUtterance.lang = 'hi-IN';
            skUtterance.rate = 0.85;

            const enUtterance = new SpeechSynthesisUtterance("Meaning: " + cleanTranslation);
            enUtterance.lang = 'en-IN';
            enUtterance.rate = 0.95;

            skUtterance.onend = () => {
              if (currentlySpeakingId === id) window.speechSynthesis.speak(enUtterance);
            };
            enUtterance.onend = () => resetTTSButtons();
            window.speechSynthesis.speak(skUtterance);
          } else {
            const enUtterance = new SpeechSynthesisUtterance(cleanTranslation);
            enUtterance.lang = 'en-IN';
            enUtterance.rate = 0.95;
            enUtterance.onend = () => resetTTSButtons();
            window.speechSynthesis.speak(enUtterance);
          }
          return;
        }
      } finally {
        resetTTSButtons();
        currentlySpeakingId = null;
      }
    }

    async function stopSpeech() {
      try {
        await invokeCapacitorPlugin('TextToSpeech', 'stop', {});
      } catch (e) {}

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      resetTTSButtons();
      currentlySpeakingId = null;
    }

    function resetTTSButtons() {
      document.querySelectorAll('.tts-btn').forEach(btn => {
        btn.innerText = '🔊 Listen';
        btn.classList.remove('speaking');
      });
      currentlySpeakingId = null;
    }
  </script>
</body>
</html>
