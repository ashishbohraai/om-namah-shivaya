<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Om Namah Shivaya</title>
  <style>
    :root {
      --bg: #0c0e12;
      --card: rgba(22, 26, 34, 0.88);
      --gold: #d4af37;
      --text: #f0f2f5;
      --text-muted: #a0abb6;
      --border: rgba(212, 175, 55, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: linear-gradient(rgba(12, 14, 18, 0.78), rgba(12, 14, 18, 0.88)), 
                  url('bg.png') no-repeat center center fixed;
      background-size: cover;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      padding: 24px 16px 12px;
      text-align: center;
      background: linear-gradient(180deg, rgba(212,175,55,0.15) 0%, transparent 100%);
    }
    h1 {
      font-size: 1.6rem;
      color: var(--gold);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .header-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 16px 0;
    }
    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 24px;
      font-size: 0.88rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 600;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
    }
    .view {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 36px;
      flex: 1;
    }
    .view.active {
      display: flex;
    }

    /* Japamala Section */
    .bead-counter-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      width: 100%;
    }
    .counter-btn {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(37, 44, 58, 0.9) 0%, rgba(17, 20, 27, 0.95) 80%);
      border: 3px solid var(--gold);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      backdrop-filter: blur(6px);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .counter-btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 14px rgba(212, 175, 55, 0.5);
    }
    .count-number {
      font-size: 3.8rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }
    .count-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .round-info {
      margin-top: 24px;
      font-size: 1rem;
      color: var(--text);
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
    }
    .reset-btn {
      margin-top: 20px;
      background: rgba(22, 26, 34, 0.8);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 18px;
      border-radius: 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Stotrams Section */
    .stotram-list {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .stotram-card {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 16px;
      backdrop-filter: blur(8px);
      position: relative;
    }
    .stotram-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .stotram-title {
      font-size: 1.2rem;
      color: var(--gold);
      margin-bottom: 2px;
    }
    .stotram-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .tts-btn {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .tts-btn:active {
      transform: scale(0.95);
    }
    .tts-btn.speaking {
      background: #d4af37;
      color: #0c0e12;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }
    .stotram-verse {
      white-space: pre-line;
      line-height: 1.8;
      font-size: 0.96rem;
      background: rgba(15, 18, 23, 0.85);
      padding: 14px;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
      margin-bottom: 12px;
    }
    .stotram-trans {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <h1>ॐ नमः शिवाय</h1>
    <div class="header-sub">Lord Shiva Devotion & Japamala</div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-btn-mala" onclick="switchTab('mala')">Japamala</button>
      <button class="tab-btn" id="tab-btn-stotram" onclick="switchTab('stotram')">Stotrams & Mantras</button>
    </div>
  </header>

  <!-- Japamala Tab -->
  <section id="mala-view" class="view active">
    <div class="bead-counter-wrapper">
      <button class="counter-btn" id="counter-btn" onclick="tapBead()">
        <span class="count-number" id="count-display">0</span>
        <span class="count-sub">/ 108</span>
      </button>
      <div class="round-info" id="round-display">Mala Rounds Completed: 0</div>
      <button class="reset-btn" onclick="resetCounter()">Reset Beads</button>
    </div>
  </section>

  <!-- Stotram Viewer Tab -->
  <section id="stotram-view" class="view">
    <div class="stotram-list" id="stotram-container">
      <p style="text-align: center; color: #888; padding: 20px;">Loading sacred stotrams...</p>
    </div>
  </section>

  <script>
    let beadCount = parseInt(localStorage.getItem('shiva_bead_count') || '0', 10);
    let malasCompleted = parseInt(localStorage.getItem('shiva_mala_count') || '0', 10);
    let currentlySpeakingIndex = null;
    let stotramData = [];

    function updateCounterUI() {
      const countEl = document.getElementById('count-display');
      const roundEl = document.getElementById('round-display');
      if (countEl) countEl.innerText = beadCount;
      if (roundEl) roundEl.innerText = `Mala Rounds Completed: ${malasCompleted}`;
    }
    updateCounterUI();

    function tapBead() {
      beadCount++;
      if (navigator.vibrate) {
        navigator.vibrate(40);
      }

      if (beadCount >= 108) {
        beadCount = 0;
        malasCompleted++;
        if (navigator.vibrate) {
          navigator.vibrate([100, 50, 150]);
        }
      }

      localStorage.setItem('shiva_bead_count', beadCount);
      localStorage.setItem('shiva_mala_count', malasCompleted);
      updateCounterUI();
    }

    function resetCounter() {
      if (confirm("Reset current bead count to 0?")) {
        beadCount = 0;
        localStorage.setItem('shiva_bead_count', 0);
        updateCounterUI();
      }
    }

    function switchTab(tab) {
      stopSpeech();

      const btnMala = document.getElementById('tab-btn-mala');
      const btnStotram = document.getElementById('tab-btn-stotram');
      const viewMala = document.getElementById('mala-view');
      const viewStotram = document.getElementById('stotram-view');

      if (tab === 'mala') {
        btnMala.classList.add('active');
        btnStotram.classList.remove('active');
        viewMala.classList.add('active');
        viewStotram.classList.remove('active');
      } else {
        btnStotram.classList.add('active');
        btnMala.classList.remove('active');
        viewStotram.classList.add('active');
        viewMala.classList.remove('active');
        loadStotrams();
      }
    }

    function loadStotrams() {
      const container = document.getElementById('stotram-container');
      if (stotramData && stotramData.length > 0) return;

      fetch('data/content.json')
        .then(res => res.json())
        .then(items => {
          stotramData = items;
          container.innerHTML = items.map((item, index) => `
            <div class="stotram-card">
              <div class="stotram-header">
                <div>
                  <h2 class="stotram-title">${item.title}</h2>
                  <div class="stotram-sub">${item.subtitle}</div>
                </div>
                <button class="tts-btn" id="tts-btn-${index}" onclick="toggleSpeech(${index})">
                  🔊 Listen
                </button>
              </div>
              <div class="stotram-verse">${item.sanskrit}</div>
              <div class="stotram-trans">${item.translation}</div>
            </div>
          `).join('');
        })
        .catch(err => {
          console.error("Content loading failed:", err);
          container.innerHTML = '<p style="text-align:center; color: #a0abb6; padding: 20px;">Unable to load stotrams.</p>';
        });
    }

    function invokeCapacitorPlugin(pluginName, methodName, options) {
      if (window.Capacitor) {
        if (window.Capacitor.Plugins && window.Capacitor.Plugins[pluginName] && window.Capacitor.Plugins[pluginName][methodName]) {
          return window.Capacitor.Plugins[pluginName][methodName](options);
        }
        if (typeof window.Capacitor.nativePromise === 'function') {
          return window.Capacitor.nativePromise(pluginName, methodName, options);
        }
        if (typeof window.Capacitor.toNative === 'function') {
          return new Promise((resolve, reject) => {
            window.Capacitor.toNative(pluginName, methodName, options, {
              callback: (result, err) => err ? reject(err) : resolve(result)
            });
          });
        }
      }
      return Promise.reject("Native Capacitor bridge unavailable");
    }

    async function toggleSpeech(index) {
      if (currentlySpeakingIndex === index) {
        await stopSpeech();
        return;
      }

      await stopSpeech();

      const item = stotramData[index];
      const cleanSanskrit = item.sanskrit.replace(/[॥।\n]/g, ' ').replace(/\s+/g, ' ').trim();
      const cleanTranslation = item.translation.replace(/\n/g, ' ').trim();

      const btn = document.getElementById(`tts-btn-${index}`);
      if (btn) {
        btn.innerText = '⏹ Stop';
        btn.classList.add('speaking');
      }
      currentlySpeakingIndex = index;

      try {
        // 1. Recite Sanskrit chant
        await invokeCapacitorPlugin('TextToSpeech', 'speak', {
          text: cleanSanskrit,
          lang: 'hi-IN',
          rate: 0.85,
          pitch: 1.0,
          volume: 1.0,
          category: 'ambient'
        });

        if (currentlySpeakingIndex !== index) return;

        // Brief 600ms pause between Sanskrit verse and English meaning
        await new Promise(r => setTimeout(r, 600));
        if (currentlySpeakingIndex !== index) return;

        // 2. Speak the English explanation
        await invokeCapacitorPlugin('TextToSpeech', 'speak', {
          text: "Meaning: " + cleanTranslation,
          lang: 'en-IN',
          rate: 0.95,
          pitch: 1.0,
          volume: 1.0,
          category: 'ambient'
        });

      } catch (nativeErr) {
        console.warn("Capacitor speak fallback to Web Speech:", nativeErr);

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();

          const sanskritUtterance = new SpeechSynthesisUtterance(cleanSanskrit);
          sanskritUtterance.lang = 'hi-IN';
          sanskritUtterance.rate = 0.85;

          const engUtterance = new SpeechSynthesisUtterance("Meaning: " + cleanTranslation);
          engUtterance.lang = 'en-IN';
          engUtterance.rate = 0.95;

          sanskritUtterance.onend = () => {
            if (currentlySpeakingIndex === index) {
              window.speechSynthesis.speak(engUtterance);
            }
          };

          engUtterance.onend = () => { resetTTSButtons(); currentlySpeakingIndex = null; };
          engUtterance.onerror = () => { resetTTSButtons(); currentlySpeakingIndex = null; };
          sanskritUtterance.onerror = () => { resetTTSButtons(); currentlySpeakingIndex = null; };

          window.speechSynthesis.speak(sanskritUtterance);
          return;
        }
      } finally {
        resetTTSButtons();
        currentlySpeakingIndex = null;
      }
    }

    async function stopSpeech() {
      try {
        await invokeCapacitorPlugin('TextToSpeech', 'stop', {});
      } catch (e) {}

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      resetTTSButtons();
      currentlySpeakingIndex = null;
    }

    function resetTTSButtons() {
      document.querySelectorAll('.tts-btn').forEach(btn => {
        btn.innerText = '🔊 Listen';
        btn.classList.remove('speaking');
      });
    }
  </script>
</body>
</html>
