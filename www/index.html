<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Om Namah Shivaya</title>
  <style>
    :root {
      --bg: #0c0e12;
      --card: rgba(22, 26, 34, 0.85);
      --gold: #d4af37;
      --gold-dim: #997e28;
      --text: #f0f2f5;
      --text-muted: #a0abb6;
      --border: rgba(212, 175, 55, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: linear-gradient(rgba(12, 14, 18, 0.78), rgba(12, 14, 18, 0.88)), 
                  url('bg.png') no-repeat center center fixed;
      background-size: cover;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      padding: 24px 16px 12px;
      text-align: center;
      background: linear-gradient(180deg, rgba(212,175,55,0.15) 0%, transparent 100%);
    }
    h1 {
      font-size: 1.6rem;
      color: var(--gold);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .header-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 16px 0;
    }
    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 24px;
      font-size: 0.88rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 600;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
    }
    .view {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 36px;
      flex: 1;
    }
    .view.active {
      display: flex;
    }

    /* Japamala Section */
    .bead-counter-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      width: 100%;
    }
    .counter-btn {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(37, 44, 58, 0.9) 0%, rgba(17, 20, 27, 0.95) 80%);
      border: 3px solid var(--gold);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      backdrop-filter: blur(6px);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .counter-btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 14px rgba(212, 175, 55, 0.5);
    }
    .count-number {
      font-size: 3.8rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }
    .count-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .round-info {
      margin-top: 24px;
      font-size: 1rem;
      color: var(--text);
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
    }
    .reset-btn {
      margin-top: 20px;
      background: rgba(22, 26, 34, 0.8);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 18px;
      border-radius: 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Stotrams Section */
    .stotram-list {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .stotram-card {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 16px;
      backdrop-filter: blur(8px);
    }
    .stotram-title {
      font-size: 1.2rem;
      color: var(--gold);
      margin-bottom: 2px;
    }
    .stotram-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .stotram-verse {
      white-space: pre-line;
      line-height: 1.7;
      font-size: 0.96rem;
      background: rgba(15, 18, 23, 0.85);
      padding: 14px;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
      margin-bottom: 12px;
    }
    .stotram-trans {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <h1>ॐ नमः शिवाय</h1>
    <div class="header-sub">Lord Shiva Devotion & Japamala</div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-btn-mala" onclick="switchTab('mala')">Japamala</button>
      <button class="tab-btn" id="tab-btn-stotram" onclick="switchTab('stotram')">Stotrams & Mantras</button>
    </div>
  </header>

  <!-- Japamala Tab -->
  <section id="mala-view" class="view active">
    <div class="bead-counter-wrapper">
      <button class="counter-btn" id="counter-btn" onclick="tapBead()">
        <span class="count-number" id="count-display">0</span>
        <span class="count-sub">/ 108</span>
      </button>
      <div class="round-info" id="round-display">Mala Rounds Completed: 0</div>
      <button class="reset-btn" onclick="resetCounter()">Reset Beads</button>
    </div>
  </section>

  <!-- Stotram Viewer Tab -->
  <section id="stotram-view" class="view">
    <div class="stotram-list" id="stotram-container">
      <!-- Injected from data/content.json -->
    </div>
  </section>

  <script>
    let beadCount = parseInt(localStorage.getItem('shiva_bead_count') || '0', 10);
    let malasCompleted = parseInt(localStorage.getItem('shiva_mala_count') || '0', 10);

    function updateCounterUI() {
      document.getElementById('count-display').innerText = beadCount;
      document.getElementById('round-display').innerText = `Mala Rounds Completed: ${malasCompleted}`;
    }
    updateCounterUI();

    function tapBead() {
      beadCount++;
      if (navigator.vibrate) {
        navigator.vibrate(40);
      }

      if (beadCount >= 108) {
        beadCount = 0;
        malasCompleted++;
        if (navigator.vibrate) {
          navigator.vibrate([100, 50, 150]);
        }
      }

      localStorage.setItem('shiva_bead_count', beadCount);
      localStorage.setItem('shiva_mala_count', malasCompleted);
      updateCounterUI();
    }

    function resetCounter() {
      if (confirm("Reset current bead count to 0?")) {
        beadCount = 0;
        localStorage.setItem('shiva_bead_count', 0);
        updateCounterUI();
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

      if (tab === 'mala') {
        document.getElementById('tab-btn-mala').classList.add('active');
        document.getElementById('mala-view').classList.add('active');
      } else {
        document.getElementById('tab-btn-stotram').classList.add('active');
        document.getElementById('stotram-view').classList.add('active');
        loadStotrams();
      }
    }

    function loadStotrams() {
      const container = document.getElementById('stotram-container');
      if (container.children.length > 0) return;

      fetch('data/content.json')
        .then(res => res.json())
        .then(items => {
          container.innerHTML = items.map(item => `
            <div class="stotram-card">
              <h2 class="stotram-title">${item.title}</h2>
              <div class="stotram-sub">${item.subtitle}</div>
              <div class="stotram-verse">${item.sanskrit}</div>
              <div class="stotram-trans">${item.translation}</div>
            </div>
          `).join('');
        })
        .catch(err => {
          container.innerHTML = '<p style="text-align:center; color: #888; padding: 20px;">Unable to load stotrams.</p>';
        });
    }
  </script>
</body>
</html>
