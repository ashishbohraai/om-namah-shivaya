name: Build Shiva App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Initialize Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Copy Custom Icons and Splash
        run: |
          echo "Replacing default Capacitor icons with custom icon.png..."
          for dir in android/app/src/main/res/mipmap-*; do
            cp -f icon.png "$dir/ic_launcher.png"
            cp -f icon.png "$dir/ic_launcher_round.png"
            cp -f icon.png "$dir/ic_launcher_foreground.png"
          done

          echo "Replacing splash screens with custom splash.png..."
          for dir in android/app/src/main/res/drawable*; do
            cp -f splash.png "$dir/splash.png" || true
          done

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shiva-Devotion-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
