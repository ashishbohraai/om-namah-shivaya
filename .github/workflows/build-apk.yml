name: Build Shiva App Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          cp -f splash.png www/bg.png || true

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Setup Android Platform & Sync Plugins
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Add Android TTS Intent Query Permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.intent.action.TTS_SERVICE" "$MANIFEST"; then
            echo "TTS query already present."
          else
            echo "Injecting TTS queries into AndroidManifest.xml..."
            sed -i '/<\/manifest>/i \    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>' "$MANIFEST"
          fi

      - name: Configure Custom App Icons
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            cp -f icon.png "$dir/ic_launcher.png"
            cp -f icon.png "$dir/ic_launcher_round.png"
            cp -f icon.png "$dir/ic_launcher_foreground.png"
          done

      - name: Setup Release Keystore & Gradle Signing
        run: |
          cd android/app
          keytool -genkeypair -v \
            -keystore my-release-key.jks \
            -alias shiva-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "ShivaPass108" \
            -keypass "ShivaPass108" \
            -dname "CN=Shiva Devotion, OU=Devotion, O=Shiva App, L=Mumbai, ST=Maharashtra, C=IN"

          # Configure build.gradle to use the keystore for release builds
          sed -i '/buildTypes {/i \    signingConfigs {\n        release {\n            storeFile file("my-release-key.jks")\n            storePassword "ShivaPass108"\n            keyAlias "shiva-key"\n            keyPassword "ShivaPass108"\n        }\n    }' build.gradle
          sed -i '/release {/a \            signingConfig signingConfigs.release' build.gradle

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiva-Devotion-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
