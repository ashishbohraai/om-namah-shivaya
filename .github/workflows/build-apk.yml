name: Build Shiva App Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          cp -f splash.png www/bg.png || true

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Setup Android Platform & Sync Plugins
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Add Android TTS Intent Query Permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.intent.action.TTS_SERVICE" "$MANIFEST"; then
            echo "TTS query already present."
          else
            echo "Injecting TTS queries into AndroidManifest.xml..."
            sed -i '/<\/manifest>/i \    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>' "$MANIFEST"
          fi

      - name: Configure Custom App Icons
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            cp -f icon.png "$dir/ic_launcher.png"
            cp -f icon.png "$dir/ic_launcher_round.png"
            cp -f icon.png "$dir/ic_launcher_foreground.png"
          done

      - name: Build Unsigned Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Generate Keystore & Sign Release APK
        run: |
          # 1. Create a dedicated release keystore
          keytool -genkeypair -v \
            -keystore my-release-key.jks \
            -alias shiva-release-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "ShivaAppSecretPass108" \
            -keypass "ShivaAppSecretPass108" \
            -dname "CN=Shiva Devotion, OU=Devotion, O=Shiva App, L=Mumbai, ST=Maharashtra, C=IN"

          # 2. Locate Android build-tools zipalign and apksigner
          BUILD_TOOLS_PATH=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          
          # 3. Align the unsigned release APK
          $BUILD_TOOLS_PATH/zipalign -v -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            Shiva-Release-aligned.apk

          # 4. Sign the APK with the newly generated key
          $BUILD_TOOLS_PATH/apksigner sign \
            --ks my-release-key.jks \
            --ks-pass pass:"ShivaAppSecretPass108" \
            --ks-key-alias shiva-release-key \
            --key-pass pass:"ShivaAppSecretPass108" \
            --out Shiva-Devotion-Release.apk \
            Shiva-Release-aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiva-Devotion-Release-APK
          path: Shiva-Devotion-Release.apk
          compression-level: 0
