name: Build Shiva App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy Background Image into Web Assets
        run: |
          cp -f splash.png www/bg.png || true

      - name: Install Dependencies
        run: npm install

      - name: Initialize Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Add Android TTS Intent Query Permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.intent.action.TTS_SERVICE" "$MANIFEST"; then
            echo "TTS query already present."
          else
            echo "Injecting TTS queries into AndroidManifest.xml..."
            sed -i '/<\/manifest>/i \    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>' "$MANIFEST"
          fi

      - name: Configure Custom Icons
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            cp -f icon.png "$dir/ic_launcher.png"
            cp -f icon.png "$dir/ic_launcher_round.png"
            cp -f icon.png "$dir/ic_launcher_foreground.png"
          done

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shiva-Devotion-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
