name: Build Shiva App Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          cp -f splash.png www/bg.png || true

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Setup Android Platform & Sync Plugins
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Add Android TTS Intent Query Permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.intent.action.TTS_SERVICE" "$MANIFEST"; then
            echo "TTS query already present."
          else
            echo "Injecting TTS queries into AndroidManifest.xml..."
            sed -i '/<\/manifest>/i \    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>' "$MANIFEST"
          fi

      - name: Configure Custom App Icons
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            cp -f icon.png "$dir/ic_launcher.png"
            cp -f icon.png "$dir/ic_launcher_round.png"
            cp -f icon.png "$dir/ic_launcher_foreground.png"
          done

      - name: Configure Release Build Signing
        run: |
          # Configure release buildType to sign with debug key so assembleRelease completes cleanly
          cd android/app
          sed -i '/buildTypes {/,/}/ { /release {/!b; :a; n; /}/!ba; a \        signingConfig signingConfigs.debug
          }' build.gradle || true

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Locate & Rename Release APK
        run: |
          find android/app/build/outputs/apk -name "*.apk"
          cp android/app/build/outputs/apk/release/*.apk Shiva-Devotion-Release.apk || cp android/app/build/outputs/apk/*/*.apk Shiva-Devotion-Release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiva-Devotion-Release-APK
          path: Shiva-Devotion-Release.apk
